<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная — Сервис рассылок</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Добро пожаловать в сервис рассылок!</h1>

    {% if user.is_authenticated %}
        <p class="mt-3">Вы вошли как <strong>{{ user.email }}</strong></p>

        <!-- Блок статистики -->
        <div class="row mt-4 mb-5">
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">Всего рассылок</h5>
                        <p class="display-4">{{ total_mailings }}</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">Активных рассылок</h5>
                        <p class="display-4">{{ active_mailings }}</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">Уникальных получателей</h5>
                        <p class="display-4">{{ unique_recipients }}</p>
                    </div>
                </div>
            </div>
        </div>

        <a href="{% url 'logout' %}" class="btn btn-danger">Выйти</a>
    {% else %}
        <div class="mt-4">
            <a href="{% url 'login' %}" class="btn btn-primary">Войти</a>
            <a href="{% url 'register' %}" class="btn btn-success">Регистрация</a>
        </div>
    {% endif %}
</div>
</body>
</html>
