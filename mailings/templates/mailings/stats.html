<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Статистика рассылки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Статистика рассылки #{{ mailing.pk }}</h1>
    <p class="text-muted">Тема: {{ mailing.message.subject }}</p>
    <a href="{% url 'home' %}" class="btn btn-secondary mb-4">На главную</a>

    <div class="row">
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title">Всего отправлено</h5>
                    <p class="display-4">{{ total_sent }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center border-success">
                <div class="card-body">
                    <h5 class="card-title text-success">Успешно</h5>
                    <p class="display-4">{{ successful }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center border-danger">
                <div class="card-body">
                    <h5 class="card-title text-danger">Ошибки</h5>
                    <p class="display-4">{{ failed }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
